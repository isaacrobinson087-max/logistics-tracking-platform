name: Deploy Dehub Logistics to Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - isaacrobinson087-max-patch-1

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: dehub-logistics-services1
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEHUB_LOGISTICS_SERVICES1 }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout completed source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBvMtd7S_NVdGjyrblKL_eeS8vB-kVSTcQ
          VITE_FIREBASE_AUTH_DOMAIN: dehub-logistics-services1.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dehub-logistics-services1
          VITE_FIREBASE_STORAGE_BUCKET: dehub-logistics-services1.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "18308452070"
          VITE_FIREBASE_APP_ID: 1:18308452070:web:6f8f9d40203dfabd853527

      - name: Authenticate with Google service account
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEHUB_LOGISTICS_SERVICES1 }}

      - name: Deploy Firestore rules, indexes and Hosting
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes,hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes,hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::No Firebase deployment credential is configured in GitHub Actions."
            exit 1
          fi

      - name: Verify Firebase Hosting endpoint
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://dehub-logistics-services1.web.app/ > /tmp/dehub-home.html
          grep -q "Dehub Logistics Services" /tmp/dehub-home.html
          echo "Firebase Hosting is serving Dehub Logistics Services."
