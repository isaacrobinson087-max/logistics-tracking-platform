name: Deploy Dehub Logistics to GitHub Pages

on:
  push:
    branches:
      - isaacrobinson087-max-patch-1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build -- --base=/logistics-tracking-platform/
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBvMtd7S_NVdGjyrblKL_eeS8vB-kVSTcQ
          VITE_FIREBASE_AUTH_DOMAIN: dehub-logistics-services1.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dehub-logistics-services1
          VITE_FIREBASE_STORAGE_BUCKET: dehub-logistics-services1.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "18308452070"
          VITE_FIREBASE_APP_ID: 1:18308452070:web:6f8f9d40203dfabd853527
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
